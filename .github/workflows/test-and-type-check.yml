name: Tests And Type Check

# `pull_request`, deliberately — not `pull_request_target`.
#
# `pull_request_target` runs with a writable token and repository secrets, and for that reason
# refuses to check out the pull request's code; it checks out the base instead. A workflow that
# tests code must therefore never use it, or it reports on a tree nobody proposed — which is what
# `lint`, `build-zip` and `prettier` did until #26 moved them here. Two checks that have never run
# at all are not worth adding under a trigger that would keep them from running on the PR.
on: [pull_request]

permissions:
  contents: read

jobs:
  # Split from `test` so a red tick says which one failed without opening the log. They share no
  # state and take about the same time, so running them in parallel costs nothing.
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # `pages/*/tsconfig.json` is exercised by nothing else: `build-zip` runs `pnpm build`, which
      # builds packages through `ready` (`tsc -b`) but never type-checks the pages. A type error in
      # `pages/popup/src` reached `release` unnoticed until someone ran this locally.
      - run: pnpm type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # `turbo test` builds workspace output first — see the `^ready` note in `turbo.json`, without
      # which `@extension/storage`'s suite reports one import failure instead of thirteen tests.
      - run: pnpm test
