name: Sync Privacy Policy to Gist

# CWS review fetches the gist, not the repo, so the gist has to be current at submission time —
# which is while the release is still unmerged in the PR to `main`. `release` is what goes in front
# of review, so it syncs too. `main` stays on the list for the post-publish merge. Last push wins,
# and `release` is always at or ahead of `main` for this file, so that merge re-syncs identical
# content.
on:
  push:
    branches: [main, release]
    paths: [cws/privacy-policy.md]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update gist
        uses: popsiclestick/gist-sync-action@v1.2.0
        with:
          auth: ${{ secrets.GIST_PAT }}
          gist_url: https://gist.github.com/LuDraGa/782b874f1e7fe0076fb2bf1509937e95
          gist_title: privacy-policy.md
          github_file: cws/privacy-policy.md
