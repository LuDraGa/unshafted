name: Sync Privacy Policy to Gist

# CWS review fetches the gist, not the repo, so the gist has to be current at submission time —
# which is while the release branch is still unmerged. `dev` is the publish staging branch: pushing
# the release branch there before submitting refreshes the gist without touching `main`. `main` stays
# on the list as a backstop for the post-approval squash-merge. Last push wins, and `dev` is always
# at or ahead of `main` for this file, so the merge re-syncs identical content.
on:
  push:
    branches: [main, dev]
    paths: [cws/privacy-policy.md]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update gist
        uses: popsiclestick/gist-sync-action@v1.2.0
        with:
          auth: ${{ secrets.GIST_PAT }}
          gist_url: https://gist.github.com/LuDraGa/782b874f1e7fe0076fb2bf1509937e95
          gist_title: privacy-policy.md
          github_file: cws/privacy-policy.md
