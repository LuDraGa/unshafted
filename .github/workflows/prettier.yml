name: Formating validation

# `pull_request`, deliberately — not `pull_request_target`.
#
# `pull_request_target` runs with a writable token and repository secrets, and for that reason
# refuses to check out the pull request's code; it checks out the base instead. A workflow that
# tests code must therefore never use it, or it reports on a tree nobody proposed. This one did,
# for long enough that a red tick here meant nothing and a green one meant less (#25).
#
# Privileged automation *about* a PR — greeting a first-time contributor, cancelling runs on close
# — still needs `pull_request_target`. Testing a PR does not: `pull_request` checks out the merge
# commit and needs no secrets, which is why the permissions below are read-only.
on: [ pull_request ]

permissions:
  contents: read

jobs:
  prettier:
    # Wired into branch protection on `main` and `release` as a required context, and the context
    # name is the job name. Renaming this job does not rename the requirement — it stops the
    # required check from ever reporting, which blocks every merge on both branches.
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The repo's own prettier, from the lockfile, the way `lint`, `test`, `type-check` and
      # `build` already run the repo's own tooling. This replaced `rutajdash/prettier-cli-action`,
      # whose whole body was `npm install --global prettier@latest` — a required status check
      # formatting against whatever npm served that morning, while the repo formatted against its
      # lockfile. Pinning the action's input worked but had to be re-pinned by hand forever, because
      # dependabot's `github-actions` ecosystem bumps `uses:` refs and never a `with:` value (#69).
      #
      # It also only ever checked the repository root: its `*.{js,jsx,ts,tsx,json}` pattern is
      # root-anchored, so nothing under `packages/`, `pages/`, `chrome-extension/` or `tools/` was
      # read at all. This is the first revision of this job that checks the workspace.
      - name: Check formatting
        run: pnpm format:check
