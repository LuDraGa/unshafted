name: Formating validation

# `pull_request`, deliberately — not `pull_request_target`.
#
# `pull_request_target` runs with a writable token and repository secrets, and for that reason
# refuses to check out the pull request's code; it checks out the base instead. A workflow that
# tests code must therefore never use it, or it reports on a tree nobody proposed. This one did,
# for long enough that a red tick here meant nothing and a green one meant less (#25).
#
# Privileged automation *about* a PR — greeting a first-time contributor, cancelling runs on close
# — still needs `pull_request_target`. Testing a PR does not: `pull_request` checks out the merge
# commit and needs no secrets, which is why the permissions below are read-only.
on: [ pull_request ]

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Prettier
        id: prettier-run
        uses: rutajdash/prettier-cli-action@v1.0.2
        with:
          config_path: ./.prettierrc
          file_pattern: "*.{js,jsx,ts,tsx,json}"

      - name: Prettier Output
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "The following files aren't formatted properly:"
          echo "${{steps.prettier-run.outputs.prettier_output}}"
